version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: aaces-postgres-test
    environment:
      POSTGRES_DB: aaces_test
      POSTGRES_USER: aaces_user
      POSTGRES_PASSWORD: aaces_password
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaces_user -d aaces_test"]
      interval: 5s
      timeout: 3s
      retries: 5
