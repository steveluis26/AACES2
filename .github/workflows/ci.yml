name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy
      - run: ruff check . || true
      - run: python -c "from app.core.config import settings; print('Config OK')"

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aaces_test
          POSTGRES_USER: aaces_user
          POSTGRES_PASSWORD: aaces_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready -U aaces_user -d aaces_test
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U aaces_user -d aaces_test && break
            sleep 1
          done
      - name: Run tests
        run: pytest tests/ -v --timeout=60
        env:
          DATABASE_URL: postgresql+asyncpg://aaces_user:aaces_password@localhost:5433/aaces_test
          SECRET_KEY: test-secret-key
          ENCRYPTION_KEY: test-key-32-bytes-long-for-testing!
          DEBUG: "true"
          ALLOW_DEV_LOGIN: "true"

  frontend-lint:
    name: Frontend - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm run type-check || true

  frontend-test:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test || true

  build:
    name: Build - Docker
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker compose build --parallel
        env:
          DOCKER_BUILDKIT: 1
