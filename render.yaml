# Render.com configuration for AACES Backend
# Docs: https://render.com/docs/deploy-fastapi

services:
  - type: web
    name: aaces-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DEBUG
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: aaces-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_DEV_LOGIN
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://aaces-frontend.onrender.com"

databases:
  - name: aaces-db
    plan: free
    databaseName: aaces_db
    user: aaces_user
